[project]
name = "eeg-explorer"
version = "0.1.0"
description = "Local-first EEG recording exploration and transparent pattern comparison"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "numpy>=2,<3", "scipy>=1.15,<2", "mne>=1.9,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
training = ["torch>=2.6,<3", "scikit-learn>=1.6,<2", "psutil>=6,<8"]
v4 = [
  "pyriemann>=0.6", "fooof>=1.1", "antropy>=0.1.6", "lightgbm>=4",
  "mne-connectivity>=0.7", "openpyxl>=3.1", "braindecode>=1.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "edfio>=0.4,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
